name: Deploy Thaarai E-Commerce

on:
  push:
    branches:
      - deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  security-scan:
    name: Security & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Warning only for now

      - name: Dockerfile Lint (Hadolint)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3008,DL3018 # Alpine specific ignores
        continue-on-error: true

  build-and-push:
    name: Build & Push Images
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.BACKEND_PUBLIC_URL }}/api
            VITE_BACKEND_URL=${{ secrets.BACKEND_PUBLIC_URL }}/
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/thaarai-frontend:latest

  deploy:
    name: Deploy Frontend to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
      SSH_USERNAME: ${{ secrets.EC2_SSH_USERNAME }}
      SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.EC2_SSH_PASSPHRASE }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Validate SSH configuration
        shell: bash
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "EC2_SSH_HOST is missing"
            exit 1
          fi

          if [ -z "$SSH_USERNAME" ]; then
            echo "EC2_SSH_USERNAME is missing"
            exit 1
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "EC2_SSH_KEY is missing"
            exit 1
          fi

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          debug: true
          script_stop: true
          script: |
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker rm -f thaarai-frontend || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/thaarai-frontend:latest
            docker run -d \
              --name thaarai-frontend \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/thaarai-frontend:latest
